name: uzhavan_ai
description: Uzhavan.AI — offline crop grading and fair-price marketplace for farmers.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Offline-first local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3

  # Edge AI (on-device crop grading)
  tflite_flutter: ^0.11.0
  camera: ^0.11.0
  image: ^4.3.0
  uuid: ^4.5.1

  # Networking / sync
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2

  # Voice (Bhashini streaming ASR/TTS)
  web_socket_channel: ^3.0.1
  record: ^5.1.2
  just_audio: ^0.9.40

  # Location for scan tagging / logistics
  geolocator: ^13.0.1

  # State management
  provider: ^6.1.2

  # i18n (Tamil-first UI)
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/lang/
